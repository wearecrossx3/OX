name: Build OX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease 2>&1 | tee build.log

      - name: Share build log on failure
        if: failure()
        run: |
          grep -E "^e: |^w: .*Unresolved|What went wrong|error:|Exception" -A3 build.log | head -400 > errors.log || true
          tail -150 build.log >> errors.log
          git config user.name "ox-ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rq --cached . || true
          git add -f errors.log
          git commit -qm "build ${{ github.run_number }} log"
          git push -f origin ci-logs

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk OX-v1.0.${{ github.run_number }}.apk
          cp app/build/outputs/bundle/release/app-release.aab OX-v1.0.${{ github.run_number }}-playstore.aab

      - uses: actions/upload-artifact@v4
        with:
          name: OX-apk
          path: |
            OX-*.apk
            OX-*.aab

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OX v1.0.${{ github.run_number }}
          prerelease: true
          files: |
            OX-*.apk
            OX-*.aab
